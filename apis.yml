aid: sensefinity
name: Sensefinity
description: >-
  Sensefinity is a supply-chain IoT company ("The IoT Transformation Company")
  delivering real-time tracking, monitoring, and analytics for global cargo and
  logistics operations. Its platform combines GPS/NB-IoT tracking devices for
  maritime containers, pallets, and vehicles with temperature and condition
  (cold-chain) sensors, indoor location tracking, a cloud analytics and machine
  learning layer, and digital product passport / blockchain integrations. The
  operational platform is delivered as a hosted web application (uiadmin.sensefinity.com)
  and mobile asset-management apps, serving enterprise customers across food,
  pharma, automotive, and manufacturing supply chains. No public developer
  portal, OpenAPI specification, or SDK surface is published as of this profile;
  a private API host (api.sensefinity.com) backs the platform.
